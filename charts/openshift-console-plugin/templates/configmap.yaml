apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "openshift-console-plugin.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
data:
  nginx.conf: |
    error_log /dev/stdout info;
    events {}
    http {
      access_log         /dev/stdout;
      include            /etc/nginx/mime.types;
      default_type       application/octet-stream;
      keepalive_timeout  65;
      server {
        listen              {{ .Values.plugin.port }} ssl;
        listen              [::]:{{ .Values.plugin.port }} ssl;
        ssl_certificate     /var/cert/tls.crt;
        ssl_certificate_key /var/cert/tls.key;
        root                /usr/share/nginx/html;

        location = /healthz {
          default_type text/plain;
          return 200 "ok\n";
        }

        location = /config.json {
          default_type application/json;
          add_header Cache-Control "no-store";
          alias /etc/plugin-config/config.json;
        }
      }
    }
  config.json: |
    {"readOnly": {{ .Values.plugin.readOnly | default false }}}
